services:
  baihu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
    - ./data:/app/data
    - ./configs:/app/configs
    - ./envs:/app/envs
    environment:
    - TZ=Asia/Shanghai
    restart: unless-stopped
    expose:
    - "8052"
    deploy:
      resources:
        limits:
          memory: '268435456'
          cpus: 0.5
        reservations: {}
    mem_limit: 268435456
    memswap_limit: 268435456
    cpus: 0.5
